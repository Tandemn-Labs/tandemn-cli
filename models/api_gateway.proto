syntax = "proto3";

package tandemn.api.gateway;

// Main request message for submitting jobs to central server
message SendToCentralServerRequestBatched {
  string user_id = 1;
  optional string selected_file = 2;  // S3 path to the file
  
  // Job configuration fields
  string description = 3;
  string task_type = 4;
  string task_priority = 5;
  optional string model_name = 6;
  string engine = 7;
  optional QuantizationBits quantization_bits = 8;
  optional bool is_speculative_decode = 9;
  optional bool is_pd_disaggregation = 10;
  string slo_mode = 11;
  string placement = 12;
  
  // Engine-specific configurations
  optional VLLMSpecificConfig vllm_specific_config = 13;
  // Future: sglang_specific_config, diffusers_specific_config, etc.
}

// Quantization bit precision
enum QuantizationBits {
  QUANTIZATION_BITS_UNSPECIFIED = 0;
  QUANT_4BIT = 1;
  QUANT_8BIT = 2;
  QUANT_16BIT = 3;
}

// Speculative decoding configuration
message SpeculativeConfig {
  enum Method {
    METHOD_UNSPECIFIED = 0;
    NGRAM = 1;
    SUFFIX = 2;
    EAGLE = 3;
    EAGLE3 = 4;
    MLP_SPECULATOR = 5;
    DRAFT_MODEL = 6;
    MTP = 7;
    DEEPSEEK_MTP = 8;
    GLM4_MOE_MTP = 9;
    QWEN3_NEXT_MTP = 10;
    LONGCAT_FLASH_MTP = 11;
  }
  
  optional Method method = 1;
  optional string model = 2;
  optional int32 draft_tensor_parallel_size = 3;  // default: 1
  optional int32 num_speculative_tokens = 4;
  optional int32 max_model_len = 5;
  optional string revision = 6;
  optional int32 prompt_lookup_max = 7;
}

// vLLM-specific configuration
message VLLMSpecificConfig {
  enum ConfigFormat {
    CONFIG_FORMAT_UNSPECIFIED = 0;
    AUTO = 1;
    MISTRAL = 2;
  }
  
  enum TokenizerMode {
    TOKENIZER_MODE_UNSPECIFIED = 0;
    TOKENIZER_AUTO = 1;
    DEEPSEEK = 2;
    TOKENIZER_MISTRAL = 3;
  }
  
  enum KVCacheDtype {
    KV_CACHE_DTYPE_UNSPECIFIED = 0;
    KV_AUTO = 1;
    BFLOAT16 = 2;
    FP8 = 3;
    FP8_DS_MLA = 4;
    FP8_E4M3 = 5;
    FP8_E5M2 = 6;
    FP8_INC = 7;
  }
  
  // Persona 3 config
  optional int32 max_model_len = 1;
  optional bool trust_remote_code = 2;  // default: true
  optional int32 max_num_seqs = 3;
  optional int32 max_num_batched_tokens = 4;
  optional ConfigFormat config_format = 5;  // default: AUTO
  
  // Persona 2 config
  optional string tokenizer = 6;
  optional TokenizerMode tokenizer_mode = 7;  // default: TOKENIZER_AUTO
  optional KVCacheDtype kv_cache_dtype = 8;
  optional SpeculativeConfig speculative_config = 9;
  optional int32 limit_mm_per_prompt = 10;  // default: 20
}

